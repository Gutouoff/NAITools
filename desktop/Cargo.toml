[workspace]
members = ["crates/studio-core", "crates/studio-nai", "src-tauri"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-core = { path = "crates/studio-core" }
studio-nai = { path = "crates/studio-nai" }
[profile.release]
codegen-units = 1
lto = "thin"
strip = true
